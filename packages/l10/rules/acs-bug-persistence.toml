[rule]
id = "acs.bug-persistence"
title = "Bug Fixing — Persist Tried Approaches to File"
domain = "agentic-coding-school"
chapter = "Debugging & Verifying Output"
class = "fundamental-techniques"

trigger = "an agent is debugging a non-trivial failure across multiple turns or contexts."

applies_when = """
a bug fix spans more than one chat session, OR a fresh-context attempt is
being made, OR the same bug keeps re-occurring across commits.
"""

rule_body = """
Per the Agentic Coding School (Techniques / Debugging & Verifying Output),
when debugging a non-trivial bug:

  1. Persist every tried approach to a file (e.g. `bug-log.md` or the
     ProofPacket evidence section). Include what was tried, why it
     didn't work, and the resulting state.
  2. Before each new attempt, re-read the log to avoid repeating failed
     approaches in the new context.
  3. After a fresh context reset, the log is the only continuity you have.
  4. When the bug is resolved, archive the log with the fix's commit hash
     for future reference.

This rule is the operational companion to the canonical
`agentic-context-engineering` skill. Without it, every fresh context
starts from zero and the same dead-ends get re-explored.
"""

evidence = """
source: https://www.agenticcoding.school/member/class/fundamental-techniques
references:
  - Bug Fixing Across Chats lesson
  - Just Run It Again lesson
related_lessons:
  - Agent Introspection
"""

[verification]
gates = [
  "bug-log.md exists for any non-trivial bug fix",
  "log is re-read at the start of each new context",
  "log is archived with the fix's commit hash",
]

